name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

# Who may merge (and the staging -> main only rule) lives in merge-gate.yml.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # On merge: apply supabase/migrations to the hosted project for that branch.
  # staging -> sg-not-boring-staging, main -> sg-not-boring (production).
  # Secrets live in GitHub Environments that only their own branch can use.
  migrate:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    concurrency: migrate-${{ github.ref }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ github.ref_name == 'main' && 'pnzjujwgvycdriwomwew' || 'pyaqltngppzgcodojita' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push --yes
